version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: daily
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - python

  # The docs site doesn't ship with joflux, so its updates use chore, which doesn't cut a release.
  # deps would, and every site dependency bump would publish a new release and Homebrew formula.
  - package-ecosystem: npm
    directory: /website
    open-pull-requests-limit: 10
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - website
